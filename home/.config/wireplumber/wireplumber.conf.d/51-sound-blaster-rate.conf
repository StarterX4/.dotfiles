{
  "monitor.alsa.rules": [
    {
      "matches": [
        {
          "node.name": "~alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_X1.*"
        }
      ],
      "actions": {
        "update-props": {
          "audio.rate": 96000,
          "audio.allowed-rates": [ 44100, 48000, 88200, 96000 ],
          "session.suspend-timeout-seconds": 0
        }
      }
    }
  ]
}
