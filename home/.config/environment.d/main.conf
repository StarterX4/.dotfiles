# Root-less Docker
#DOCKER_HOST="unix://${XDG_RUNTIME_DIR}/docker.sock"

# Wine RT
WINE_RT=15
WINE_SRV_RT=10
STAGING_RT_PRIORITY_BASE=15
STAGING_RT_PRIORITY_SERVER=10
WINEFSYNC=1

# Steam
#STEAM_RUNTIME=0 - breaks steam launch as of 09.09.2026
STEAM_RUNTIME_PREFER_HOST_LIBRARIES=1

# Proton
DXVK_FRAME_RATE=360
DXVK_HDR=1
PROTON_ENABLE_D8VK=1
PROTON_ENABLE_WAYLAND=1

# QT & KDE
QT_STYLE_OVERRIDE=kvantum-dark
#QT_QPA_PLATFORMTHEME=qt5ct
QT_QPA_PLATFORM=wayland-egl
#KSCREEN_BACKEND=fake #KScreen has no Wayland backend, calls into KScreen will fail (workaround to make it at least not crash)
#QT_LOGGING_RULES="kwin_*.debug=true"
QT_LOGGING_RULES='*=false'
#KWIN_COMPOSE=O2ES
#KWIN_OPENGL_INTERFACE=egl
KWIN_DRM_DISABLE_TRIPLE_BUFFERING=1
#ENABLE_HDR_WSI=1

# GTK & GNOME
GDK_BACKEND=wayland
GSK_RENDERER=vulkan
GTK_THEME=Sweet-Dark #GTK4 theme, since stupid devs borked setting theme in settings.ini
#GSK_RENDERING_MODE=full-redraw #full redraw every frame
#CLUTTER_BACKEND=wayland #nie działa, domyślnie używa GDK
#GTK_USE_PORTAL=1

# SDL
#SDL_AUDIODRIVER="pipewire,pulse"
# Prefer Wayland but allow x11 for broken programs
#SDL_VIDEODRIVER="wayland,x11"

# Enlightenment
ECORE_EVAS_ENGINE=wayland-egl
ELM_DISPLAY=wl
ELM_ACCEL=opengl

# Mesa
#LIBGL_DEBUG=verbose
#MESA_SHADER_CACHE_DIR=$HOME/.cache/mesa_shader_cache
#https://www.phoronix.com/news/Mesa-23.1-RADV-Vulkan-Video
RADV_VIDEO_DECODE=1

# Common
#XDG_SESSION_TYPE=wayland

# Libreoffice globalmenu
#SAL_USE_VCLPLUGIN=gtk3

# Firefox
MOZ_ENABLE_WAYLAND=1

# WLRoots
WLR_RENDERER=vulkan

# libva
VAAPI_MPEG4_ENABLED=true
GST_VAAPI_ALL_DRIVERS=1

# PlayOnLinux
POL_IgnoreWineErrors=true

# Electron
ELECTRON_OZONE_PLATFORM_HINT=wayland

# Rust/Cargo
CARGO_TARGET_DIR='/tmp/cargotarget'
RUSTC_WRAPPER='/bin/sccache'
